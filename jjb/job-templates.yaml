# CI for gerrit
- job:
    name: 'gerrit'
    node: Docker
    wrappers:
      # needs to be 1 hour and 30 mins to give gerrit enough time to build.
      # It can sometimes take a while.
      - timeout:
          timeout: 90
          fail: true
      - timestamps
    triggers:
     - zuul
    builders:
      - setup:
          # .gitsubmodules uses relative url, we need to point to upstream
          # gerrit repository to fetch them which is handled by the repo build
          # script.
          submodules: false
      - docker-run-with-log-cache-src:
          image: docker-registry.wikimedia.org/releng/gerrit:1.5.0-s6
          entrypoint: /src/wmf-build.py
          environment:
              LOG_DIR: /log
          volumes:
              /srv/git: /srv/git:ro
    publishers:
      - archive:
         artifacts: 'log/*.war, log/*.jar, log/*.js'
      - teardown

# Generate project documentation using docker and publish it
- job-template: &job_template_docker-doc-publish
    name: '{name}-doc-publish'
    node: Docker
    concurrent: false
    triggers:
     - zuul
    builders:
     - docker-cache-dir
     - docker-log-dir
     - docker-src-dir
     - docker-ci-src-setup-simple
     - docker-run-with-log-cache-src:
         image: '{image}'
         workdir: /src
         args: '{obj:args|}'
         environment: '{obj:environment|}'
     - doc-publish:
        docsrc: '{docsrc}'
        docdest: '{docdest}'
    publishers:
     - archive-log-allow-empty
     - docker-cleanup

- job-template:
    !!merge : *job_template_docker-doc-publish
    name: '{name}-doc-tag-publish'
    triggers:
        - zuul-post

- job-template:
    !!merge : *job_template_docker-doc-publish
    name: '{name}-doc-latest-publish'
    triggers:
        - zuul-post

# Node job for 'npm install-test'
- job-template:
    name: '{name}-{node_version}'
    node: Docker
    triggers:
     - zuul
    properties:
        - build-discarder:
            days-to-keep: 7
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
    publishers:
     - archive-log-allow-empty
     - teardown

# Job for 'npm install & npm run {script}'
- job-template:
    name: '{name}-{node_version}-run{script}'
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
        options: '--shm-size 1g'
        args: '{script}'
    publishers:
     - archive-log-allow-empty
     - teardown

- job-template:
    name: 'branchdeploy-{key}-{node_version}-npm'
    node: Docker
    triggers:
     - zuul
    wrappers:
     - timeout:
         timeout: 30
         fail: true
     - timestamps
     - credentials-binding:
          - text:
              credential-id: BRANCHDEPLOY_AUTH_TOKEN_{key}
              variable: BRANCHDEPLOY_AUTH_TOKEN
          - text:
              credential-id: BRANCHDEPLOY_SITE_ID_{key}
              variable: BRANCHDEPLOY_SITE_ID
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{node_image}'
        workdir: /src
        args: 'branch-deploy'
    publishers:
     # FIXME: use `- teardown` to save cache?
     - docker-cleanup

# Node job for 'npm install-test' (with browsers installed)
- job-template:
    name: '{name}-{node_version}-browser'
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
        options: >-
            --shm-size 1g
            --env LOG_DIR=/log
    publishers:
     - archive-log-allow-empty
     - teardown

# Node job for 'npm cit' (with browser installed)
# and publishing /coverage from workspace
# to doc.wikimedia.org/cover/:DOC_PROJECT
- job-template:
    name: 'generic-{node_version}-browser-coverage-publish'
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
     - cover-publish:
        src: 'src/coverage'
        dest: '$DOC_PROJECT'
    publishers:
     # FIXME: use `- teardown` to save cache?
     - docker-cleanup


# Node job for 'npm ci && npm coverage' (with browser installed)
# and publishing /coverage from workspace
# to doc.wikimedia.org/cover/:DOC_PROJECT
- job-template:
    name: 'generic-{node_version}-browser-direct-coverage-publish'
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
        args: 'coverage'
     - cover-publish:
        src: 'src/coverage'
        dest: '$DOC_PROJECT'
    publishers:
     # FIXME: use `- teardown` to save cache?
     - docker-cleanup

# Node jobs for 'npm install && npm run doc'
# Publishing workspace/docs to doc.wikimedia.org/:DOC_PROJECT/:DOC_SUBPATH/
# - DOC_PROJECT: determined in parameter_functions.py (repo name)
# - DOC_SUBPATH: determined in parameter_functions.py (branch or tag)
- job-template:
    name: generic-{node_version}-docs-publish
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: '{image}'
        args: 'doc'
     - doc-publish:
        docsrc: 'src/docs'
        docdest: '$DOC_PROJECT/$DOC_SUBPATH'
    publishers:
     - teardown

# Publishing workspace/docs to doc.wikimedia.org/:DOC_PROJECT/:DOC_SUBPATH/js/
# - DOC_PROJECT: determined in parameter_functions.py (mw extension name)
# - DOC_SUBPATH: determined in parameter_functions.py (branch or tag)
- job:
    name: mwext-node24-docs-publish
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: 'docker-registry.wikimedia.org/releng/node24-test:24.18.0-s4'
        args: 'doc'
     - doc-publish:
        docsrc: 'src/docs'
        docdest: '$DOC_PROJECT/$DOC_SUBPATH/js'
    publishers:
     - teardown

- job:
    name: mwext-node26-docs-publish
    node: Docker
    triggers:
     - zuul
    builders:
     - setup
     - docker-run-with-log-cache-src:
        image: 'docker-registry.wikimedia.org/releng/node26-test:26.8.2'
        args: 'doc'
     - doc-publish:
        docsrc: 'src/docs'
        docdest: '$DOC_PROJECT/$DOC_SUBPATH/js'
    publishers:
     - teardown

- project:
    name: 'generic'
    node_version:
        - node24:
            image: docker-registry.wikimedia.org/releng/node24-test-browser:24.18.0-s4
        - node26:
            image: docker-registry.wikimedia.org/releng/node26-test-browser:26.8.2
    jobs:
        - 'generic-{node_version}-browser-coverage-publish'
        - 'generic-{node_version}-browser-direct-coverage-publish'
        - '{name}-{node_version}-browser'
        - '{name}-{node_version}-run{script}':
           script: 'doc'

       # The basic jobs images do not have Web browsers:
        - '{name}-{node_version}':
            node_version: &node_without_browsers
                - node24:
                    image: docker-registry.wikimedia.org/releng/node24-test:24.18.0-s4
                - node26:
                    image: docker-registry.wikimedia.org/releng/node26-test:26.8.2
        - 'generic-{node_version}-docs-publish':
            node_version: *node_without_browsers

# Same as 'generic', but kept separate so that gate-and-submit jobs
# don't cross-block between mediawiki/* and non-mediawiki changes.
- project:
    name: 'mwext'
    jobs:
        - '{name}-{node_version}-run{script}':
           script: 'doc'
           node_version:
               - node24:
                   image: docker-registry.wikimedia.org/releng/node24-test-browser:24.18.0-s4
               - node26:
                   image: docker-registry.wikimedia.org/releng/node26-test-browser:26.8.2

# Same as 'mwext', but solo so BlueSpice repos don't conflict
- project:
    name: 'mwext-bluespice'
    jobs:
        - '{name}-{node_version}':
           node_version:
               - node24:
                   image: docker-registry.wikimedia.org/releng/node24-test-browser:24.18.0-s4
               - node26:
                   image: docker-registry.wikimedia.org/releng/node26-test-browser:26.8.2

- project:
    name: branchdeploy
    jobs:
        - 'branchdeploy-{key}-{node_version}-npm':
            node_version:
                - node24:
                    node_image: docker-registry.wikimedia.org/releng/node24-test:24.18.0-s4
                - node26:
                    node_image: docker-registry.wikimedia.org/releng/node26-test:26.8.2
            key:
                - codex
