# Holds various projects under 'labs/'

# This is the standard tox job for WMCS tools, unless they need something special.
- project:
    name: 'labs'
    jobs:
     - '{name}-tox'

- project:
    name: CVNBot
    jobs:
     - '{name}-tox-coverage-publish':
         coverenv: 'cover'
         coversrc: 'htmlcov'
         coverdest: 'CVNBot'

- project:
    name: 'labs-tools-Isa'
    jobs:
        - '{name}-tox'

- project:
    name: 'labs-tools-WdTmCollab'
    jobs:
        - '{name}-tox'

- project:
    name: 'labs-tools-commons-mass-description'
    jobs:
        - '{name}-tox'

- project:
    name: 'labs-tools-harvesting-data-refinery'
    jobs:
        - '{name}-tox'

- project:
    name: 'labs-tools-heritage'
    jobs:
        - '{name}-tox':
            docker_image_var: docker-registry.wikimedia.org/releng/tox-v3-pywikibot:1.3
            build_timeout: 6  # T206913

