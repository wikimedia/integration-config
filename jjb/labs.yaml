# Holds various projects under 'labs/' where the generic jobs aren't sufficient

- project:
    name: CVNBot
    jobs:
     - '{name}-tox-coverage-publish':
         coverenv: 'cover'
         coversrc: 'htmlcov'
         coverdest: 'CVNBot'

- project:
    name: 'labs-tools-heritage'
    jobs:
        - '{name}-tox':
            docker_image_var: docker-registry.wikimedia.org/releng/tox-v3-pywikibot:1.4
            build_timeout: 6  # T206913
