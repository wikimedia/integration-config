- job-template:
    name: '{name}-ruby3.3-rake'
    node: Docker
    docker_image_var: docker-registry.wikimedia.org/releng/rake-ruby3.3:0.1.0-s2
    triggers:
        - zuul
    builders:
        - docker-castor-load
        - docker-log-dir
        - docker-src-dir
        - docker-run-with-log-cache-src:
            image: '{obj:docker_image_var}'
    wrappers:
      - timeout:
          timeout: '{obj:build_timeout|3}'  # minutes
      - timestamps
    publishers:
        - archive-log-allow-empty
        - teardown

# Call bundle 'yard' to generate documentation and have it published
- job-template:
    name: '{name}-ruby3.3-bundle-yard-publish'
    node: Docker
    concurrent: false
    triggers:
     - zuul
    builders:
     - docker-castor-load
     - docker-log-dir
     - docker-src-dir
     - docker-run-with-log-cache-src:
         image: docker-registry.wikimedia.org/releng/rake-ruby3.3:0.1.0-s2
         args: 'yard'
     - doc-publish:
         docsrc: 'src/doc'
         docdest: 'rubygems/{name}'
    publishers:
     - archive-log-allow-empty
     - teardown
